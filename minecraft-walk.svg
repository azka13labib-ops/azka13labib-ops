<svg width="600" height="110" viewBox="0 0 600 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#6B4226"/>
      <rect width="40" height="10" fill="#4C9A2A"/>
      <rect x="0" y="0" width="10" height="10" fill="#5CB12F"/>
      <rect x="20" y="0" width="10" height="10" fill="#5CB12F"/>
      <rect x="10" y="10" width="20" height="6" fill="#3E7A1F"/>
      <rect x="6" y="16" width="6" height="6" fill="#7A5230"/>
      <rect x="24" y="22" width="6" height="6" fill="#7A5230"/>
    </pattern>
  </defs>
  <rect width="600" height="110" fill="#1A0033"/>
  <rect x="0" y="70" width="600" height="40" fill="url(#grass)"/>

  <g id="steve" transform="translate(40,16)">
    <animateTransform attributeName="transform" type="translate" values="40,16; 560,16; 40,16" dur="14s" repeatCount="indefinite" calcMode="linear"/>
    <rect x="8" y="0" width="16" height="6" fill="#4A2F1B"/>
    <rect x="8" y="6" width="16" height="10" fill="#C68642"/>
    <rect x="11" y="10" width="3" height="3" fill="#FFFFFF"/>
    <rect x="18" y="10" width="3" height="3" fill="#FFFFFF"/>
    <rect x="8" y="16" width="16" height="18" fill="#1BB6B0"/>
    <rect x="2" y="16" width="6" height="16" fill="#C68642"/>
    <rect x="24" y="16" width="6" height="16" fill="#C68642"/>
    <rect x="8" y="34" width="7" height="20" fill="#3454A8">
      <animate attributeName="height" values="20;13;20" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="17" y="34" width="7" height="13" fill="#3454A8">
      <animate attributeName="height" values="13;20;13" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
